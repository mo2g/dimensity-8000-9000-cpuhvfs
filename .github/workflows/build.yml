name: package-magisk-module

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to create or reuse for the release"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts and kernel object
        run: |
          set -eu
          for f in bin/lib.sh bin/cpuhvfs-ctl customize.sh post-fs-data.sh service.sh uninstall.sh action.sh; do
            sh -n "$f"
          done
          bash -n scripts/build-ko.sh scripts/package.sh
          test -s lib/cpuhvfs.ko
          expected=$(grep -a -o 'vermagic=[^ ]*' lib/cpuhvfs.ko | head -1 | cut -d= -f2)
          test "$expected" = "5.10.136-pearl-cve43499"
          file lib/cpuhvfs.ko | grep -q 'aarch64'

      - name: Package
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: magisk-module
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --notes "Magisk module $RELEASE_TAG. Verify the kernel vermagic before flashing."
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --notes "Magisk module $RELEASE_TAG. Verify the kernel vermagic before flashing." \
              --target "$GITHUB_SHA"
          fi
