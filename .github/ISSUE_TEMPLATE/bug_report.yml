name: Bug report
description: Report a module, driver, install, or safety problem.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach proprietary boot images, firmware, or personal data.
        If the phone bootloops, use Magisk safe mode or restore your boot backup first.
  - type: input
    id: device
    attributes:
      label: Device and ROM
      description: Model, device codename, ROM version, Android version.
      placeholder: Redmi Note 12T Pro / pearl / MIUI 14 V14.0.5.0 / Android 13
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel release
      description: Output of `uname -r`.
      placeholder: 5.10.136-pearl-cve43499
    validations:
      required: true
  - type: input
    id: magisk
    attributes:
      label: Root / Magisk version
      description: Output of `magisk -v`, or the root solution and version.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Status output
      description: Paste `cpuhvfs-ctl probe`, `cpuhvfs-ctl status`, and Smart Power `uv.sh status` if available.
      render: text
    validations:
      required: true
  - type: textarea
    id: dmesg
    attributes:
      label: Relevant kernel log
      description: Paste the relevant lines, not the entire dmesg if possible.
      render: text
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: What did you run, and what happened?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I backed up boot_a and know how to roll back.
          required: true
        - label: I did not bypass the kernel/module compatibility check.
          required: true
        - label: I understand that this is experimental kernel software.
          required: true
