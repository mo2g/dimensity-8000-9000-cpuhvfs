<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Dimensity cpuhvfs terminal status preview</title>
  <desc id="desc">Example Smart Power status output from the tested Redmi Note 12T Pro device.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="960" height="440" rx="24" fill="#0b1220"/>
  <rect x="18" y="18" width="924" height="404" rx="16" fill="url(#bg)" stroke="#26344d" filter="url(#shadow)"/>
  <circle cx="48" cy="48" r="6" fill="#fb7185"/>
  <circle cx="68" cy="48" r="6" fill="#fbbf24"/>
  <circle cx="88" cy="48" r="6" fill="#34d399"/>
  <text x="112" y="53" fill="#93a4bd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">pearl / tested device</text>
  <line x1="18" y1="76" x2="942" y2="76" stroke="#26344d"/>
  <g fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <text x="48" y="112" fill="#7dd3fc">$</text>
    <text x="72" y="112">su -c 'sh /data/adb/modules/smart_power/bin/uv.sh status'</text>
    <text x="48" y="150" fill="#a7f3d0">uv_module_enabled=1</text>
    <text x="48" y="178" fill="#a7f3d0">uv_ko_match=1</text>
    <text x="48" y="206" fill="#a7f3d0">uv_eem_present=1</text>
    <text x="48" y="234" fill="#fde68a">uv_limit=10</text>
    <text x="48" y="262" fill="#fde68a">uv_verified=-5 -8 -9 0</text>
    <text x="48" y="290" fill="#fde68a">uv_boot_profile=-5 -8 -9 0</text>
    <text x="48" y="318" fill="#fca5a5">uv_live=-31.25 -50.00 -56.25 0.00</text>
    <text x="48" y="346" fill="#c4b5fd">uv_state=stable</text>
    <text x="48" y="374" fill="#94a3b8">uv_trip_reason=</text>
  </g>
  <text x="48" y="404" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Measured firmware offsets; observation passed 600 s.</text>
</svg>
