<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Dimensity 8000/9000 cpuhvfs</title>
  <desc id="desc">Open-source MediaTek undervolting driver and Magisk module for Dimensity 8000/9000.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".55" stop-color="#0e1b31"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="220" fill="#1d4ed8" opacity=".16"/>
  <circle cx="1110" cy="590" r="260" fill="#059669" opacity=".10"/>
  <path d="M80 515 C240 410 330 560 470 455 S760 310 900 390 S1110 250 1210 315" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".65"/>
  <rect x="74" y="82" width="468" height="34" rx="17" fill="#0f2a3d" stroke="#164e63"/>
  <text x="96" y="105" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">GPL-2.0 · Magisk · MediaTek</text>
  <text x="74" y="208" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="750">Dimensity 8000/9000</text>
  <text x="74" y="282" fill="#c4b5fd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="650">cpuhvfs</text>
  <text x="76" y="336" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Open-source CPU undervolting driver for MT6895 / MT6896</text>
  <text x="76" y="374" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">vendor source · kernel-locked · driver-only default · crash latch</text>
  <g transform="translate(730 126)">
    <rect width="468" height="370" rx="18" fill="#0b1220" stroke="#26344d"/>
    <circle cx="24" cy="24" r="6" fill="#fb7185"/><circle cx="44" cy="24" r="6" fill="#fbbf24"/><circle cx="64" cy="24" r="6" fill="#34d399"/>
    <line x1="0" y1="44" x2="468" y2="44" stroke="#26344d"/>
    <g fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <text x="26" y="82" fill="#7dd3fc">$</text><text x="46" y="82">uv.sh status</text>
      <text x="26" y="120" fill="#a7f3d0">uv_module_enabled=1</text>
      <text x="26" y="148" fill="#a7f3d0">uv_ko_match=1</text>
      <text x="26" y="176" fill="#fde68a">uv_limit=10</text>
      <text x="26" y="204" fill="#fde68a">uv_verified=-5 -8 -9 0</text>
      <text x="26" y="232" fill="#fde68a">uv_boot_profile=-5 -8 -9 0</text>
      <text x="26" y="260" fill="#fca5a5">uv_live=-31.25 -50.00 -56.25 0.00</text>
      <text x="26" y="288" fill="#c4b5fd">uv_state=stable</text>
      <text x="26" y="316" fill="#94a3b8">uv_trip_reason=</text>
    </g>
    <rect x="26" y="342" width="416" height="1" fill="#26344d"/>
    <text x="26" y="366" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Tested: Redmi Note 12T Pro / 5.10.136-pearl-cve43499</text>
  </g>
  <text x="76" y="545" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="600">A safer replacement for the abandoned closed-source module.</text>
  <text x="76" y="580" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">github.com/mo2g/dimensity-8000-9000-cpuhvfs</text>
</svg>
