# Absolute offset limit per cluster (MTK EEM steps; 1 step ~= 6.25 mV)
# little/middle/big/cci all share this limit unless overridden below.
max_abs_steps=6

# Optional per-cluster caps (uncomment to use)
#max_little=6
#max_middle=6
#max_big=6
#max_cci=0

# Delay between cluster writes (seconds)
ramp_delay_sec=1

# Observation window after apply (seconds). Smart Power uses its own value.
observe_sec=600
